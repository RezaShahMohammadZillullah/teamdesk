<!-- Paste inside <head> of your index.html / base template -->
<meta name="theme-color" content="#09122A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TeamDesk" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="/pwa-192x192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<!-- Paste right before </body> to register the Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    });
  }
</script>
